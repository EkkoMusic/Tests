# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sarah-tamisier/package-lock.json
      - name: Install dependencies (Astro)
        working-directory: sarah-tamisier
        run: npm ci
      - name: Restore optimized images cache
        # Astro garde ici les images déjà compressées : sans ce cache, chaque
        # publication recompresse toutes les images (~2 min au lieu de quelques secondes).
        uses: actions/cache@v4
        with:
          path: sarah-tamisier/node_modules/.astro
          key: astro-images-${{ hashFiles('sarah-tamisier/package-lock.json', 'sarah-tamisier/src/assets/**') }}
          restore-keys: astro-images-
      - name: Build Sarah Tamisier portfolio (Astro)
        working-directory: sarah-tamisier
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/sarah-tamisier
        run: npm run build
      - name: Assemble site
        # 4 Mousquetaires à la racine, portfolio de Sarah dans /sarah-tamisier/
        run: |
          mkdir -p _site
          cp -r 4mousquetaires/. _site/
          cp -r sarah-tamisier/dist _site/sarah-tamisier
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
